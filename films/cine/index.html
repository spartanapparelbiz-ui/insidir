<!doctype html>
<html><head><meta charset="utf-8"><title>Insidir cine renderer</title>
<style>
@font-face{font-family:JBM;font-weight:100 800;src:url(/web/assets/fonts/JetBrainsMono-normal-latin.woff2) format("woff2")}
html,body{margin:0;background:#000;overflow:hidden;width:1920px;height:1080px}
canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}
</style>
<script src="/films/render/lib.js"></script>
<script type="importmap">{"imports":{"three":"/films/cine/node_modules/three/build/three.module.js","three/addons/":"/films/cine/node_modules/three/examples/jsm/"}}</script>
</head><body>
<canvas id="gl"></canvas><canvas id="ov" width="1920" height="1080"></canvas>
<script type="module">
import { Engine, FPS } from "./engine.js";
const q = new URLSearchParams(location.search);
const film = await import(`./${q.get("film")}.js?v=${Date.now()}`);
await document.fonts.load('800 100px JBM'); await document.fonts.load('600 40px JBM'); await document.fonts.load('500 20px JBM');
const engine = new Engine(document.getElementById("gl"), { scale: Number(q.get("scale") || 1), sub: Number(q.get("sub") || 3) });
const ov = document.getElementById("ov").getContext("2d");
await film.load(engine);
window.FRAMES = Math.round(film.duration * FPS);
window.renderFrame = f => { const t = f / FPS; film.frame(engine, ov, t); return true; };
window.__ready = window.FRAMES;
</script></body></html>
