name: Insidir engine checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: insidir
          POSTGRES_PASSWORD: insidir
          POSTGRES_DB: insidir_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U insidir" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INSIDIR_TEST_DATABASE_URL: postgresql://insidir:insidir@localhost:5432/insidir_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax checks
        run: |
          npm run check
          for f in scripts/*.mjs; do node --check "$f"; done
          for f in web/assets/js/*.js; do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - name: Verify authentic published brand marks and portraits
        run: node scripts/verify-media.mjs
      - name: Verify desktop and mobile layout in Chrome
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.58.0 axe-core@4.10.2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/visual-layout-check.mjs
      - name: Verify Insidir Intelligence in Chrome (every control, desktop and phone, errors, empty states, reduced motion)
        run: CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/intelligence-check.mjs
      - name: Verify accessibility and touch targets in Chrome (axe WCAG 2.1 AA at 1440px; no overflow and 24px targets on a phone)
        run: CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/a11y-check.mjs
      - name: Verify the dashboard in Chrome (data, filters, empty and error states, 401/402, links, overflow, nothing orange)
        run: CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/dashboard-check.mjs
      - name: Verify the V13 halftone identity on every page, personnel files included (strict palette, no orange in any hover/focus/active state or on screen, contrast, fonts, sharp images, overflow)
        run: CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/v13-palette-audit.mjs
      - name: Verify every page moves like the wordmark (dot fields, scroll trail, still atoms on product pages, hero scatter, parting atoms, click ring, scroll reveal, reduced motion, no orange pixels)
        run: CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/motion-check.mjs
      - name: Verify the research stories and creator kit in Chrome (layout, palette, copy link, referral codes, link builder)
        run: CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/stories-check.mjs
      - name: Verify every person and company has a real logo or headshot tile in Chrome
        run: CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/media-check.mjs
