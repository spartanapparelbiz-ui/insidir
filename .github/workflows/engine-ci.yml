name: Insidir engine checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Verify authentic published brand marks and portraits
        run: node scripts/verify-media.mjs
      - name: Verify desktop and mobile layout in Chrome
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.58.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/visual-layout-check.mjs
      - name: Verify the V13 halftone identity on every page (palette, contrast, fonts, overflow)
        run: CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/v13-palette-audit.mjs
