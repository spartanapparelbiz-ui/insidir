name: Team logos sync
# Daily: the team registry (lib/teams/registry.json) and its self-hosted logos (public/teams) from Polymarket's teams
# data, ESPN's official marks where Polymarket's are too small (scripts/teams-sync.ts). Commits only when something
# changed; the usual checks run on that commit.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Sync teams and logos
        run: npx tsx scripts/teams-sync.ts
      - name: Unit tests for the registry
        run: npx vitest run test/teams.test.ts
      - name: Commit when changed
        run: |
          if [ -n "$(git status --porcelain lib/teams public/teams)" ]; then
            git config user.name "insidir-bot"
            git config user.email "insidir-bot@users.noreply.github.com"
            git add lib/teams public/teams
            git commit -m "Team registry: daily sync"
            git push
          fi
