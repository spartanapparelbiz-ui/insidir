<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your account — insidir.</title>
  <meta name="description" content="Create an Insidir account to explore public-record research, source-linked insider filings and activity on stocks you follow.">
  <meta name="theme-color" content="#f9f8f4">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/SourceSerif4-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Inter-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/img/signup.jpg" as="image">
  <script>document.documentElement.classList.add('js')</script>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <script defer src="assets/js/motion.js"></script>
  <script defer src="assets/js/site.js"></script>
  <script defer src="assets/js/auth.js"></script>
</head>
<body class="auth-body auth-body--signup">
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main" class="auth auth--signup">
    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="auth-panel__inner">
        <div class="auth-brand" data-reveal="down" data-delay="60">
          <a class="logo auth-logo" href="index.html" aria-label="insidir. home">insidir.</a>
        </div>

        <div class="auth-card" data-stagger="65" data-delay="140">
          <div class="auth-plan" data-plan-badge hidden>
            <span class="pill pill--badge" data-reveal="up"><span class="dot" aria-hidden="true"></span>Pro plan selected</span>
          </div>
          <h1 id="auth-title" class="auth-title" data-split>Create your account.</h1>
          <p class="auth-sub" data-reveal="up">Start by researching a stock. No brokerage connection or portfolio setup required.</p>

          <form class="auth-form" data-auth-form="register" action="#" method="post" novalidate>
            <div class="field auth-field" data-reveal="up">
              <label class="label" for="signup-name">Full name</label>
              <input class="input" id="signup-name" name="name" type="text" autocomplete="name" placeholder="John Doe"
                     maxlength="100" required aria-describedby="signup-name-error">
              <div class="field__msg"><p class="field__error" id="signup-name-error"></p></div>
            </div>

            <div class="field auth-field" data-reveal="up">
              <label class="label" for="signup-email">Email</label>
              <input class="input" id="signup-email" name="email" type="email" inputmode="email" autocomplete="email"
                     autocapitalize="none" spellcheck="false" placeholder="you@example.com" maxlength="254" required
                     aria-describedby="signup-email-error">
              <div class="field__msg"><p class="field__error" id="signup-email-error"></p></div>
            </div>

            <div class="field auth-field auth-field--password" data-reveal="up">
              <div class="field__row">
                <label class="label" for="signup-password">Password</label>
                <span class="field__hint" id="signup-password-hint">At least 12 characters</span>
              </div>
              <input class="input" id="signup-password" name="password" type="password" autocomplete="new-password"
                     placeholder="Create a password" minlength="12" maxlength="128" required
                     aria-describedby="signup-password-hint signup-password-error">
              <div class="field__msg"><p class="field__error" id="signup-password-error"></p></div>
            </div>

            <div class="auth-submit" data-reveal="up">
              <button class="btn btn--dark btn--block auth-btn" type="submit" data-pending-label="Creating account…">
                <span class="auth-btn__spinner" aria-hidden="true"></span>
                <span class="auth-btn__label">Create account</span>
              </button>
            </div>

            <div class="form-alert" aria-live="polite" aria-atomic="true">
              <div class="form-alert__inner"><p class="form-alert__text"></p></div>
            </div>
          </form>

          <p class="auth-switch" data-reveal="up">Already have an account? <a class="auth-link" href="signin.html"><strong>Sign in</strong></a></p>
        </div>
      </div>
    </section>

    <aside class="auth-media" aria-hidden="true">
      <div class="auth-media__frame grain">
        <div class="auth-media__layer" data-auth-parallax>
          <div class="auth-media__scroll" data-parallax="0.1">
            <div class="auth-media__drift">
              <img class="auth-media__img" src="assets/img/signup.jpg" width="508" height="1056" alt="" decoding="async" fetchpriority="high">
            </div>
          </div>
        </div>
        <div class="auth-media__shade"></div>
      </div>
    </aside>
  </main>
</body>
</html>
